version: 1.0
name: secret-api-token
description: "Secret API headers from https://web-scraping.dev/testimonials"

scrapers:
  secret-headers:
    fields:
      headers:
        getter:
          type: attribute
          value: "hx-headers"

data:
  secret_api_token:
    name: "Secret API Token"
    steps:
      - id: testimonials-page
        request:
          method: GET
          url: "https://web-scraping.dev/testimonials"
        scrape:
          - id: secret-headers
            selector: "[hx-headers]"
            many: false
            using: secret-headers

logging:
  level: INFO
