version: 1.0
name: credentials-referer
description: "Credentials page with its required Referer header"

scrapers:
  page-title:
    fields:
      title: {}

data:
  credentials:
    name: "Credentials Referer"
    steps:
      - id: credentials-page
        request:
          method: GET
          url: "https://web-scraping.dev/credentials"
          headers:
            Referer: "https://web-scraping.dev/login"
        scrape:
          - id: page-title
            selector: "title"
            many: false
            using: page-title

logging:
  level: INFO
